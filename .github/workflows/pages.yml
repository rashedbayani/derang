name: Build and publish Derang
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: derang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Set frontend API address
        env:
          DERANG_API_BASE: ${{ vars.DERANG_API_BASE }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const apiBase = process.env.DERANG_API_BASE || ""; if (apiBase && !apiBase.startsWith("https://")) throw new Error("Use an HTTPS API URL"); writeFileSync("dist/derang/browser/config.json", JSON.stringify({apiBase}));'
      - name: Verify configured backend
        if: github.event_name != 'pull_request' && vars.DERANG_API_BASE != ''
        env:
          DERANG_API_BASE: ${{ vars.DERANG_API_BASE }}
        run: |
          node --input-type=module <<'JS'
          const base = new URL(process.env.DERANG_API_BASE);
          if (base.protocol !== 'https:' || base.username || base.password || base.search || base.hash) {
            throw new Error('DERANG_API_BASE must be a public HTTPS API URL.');
          }
          const origin = 'https://${{ github.repository_owner }}.github.io';
          const health = new URL(base.pathname.replace(/\/$/, '') + '/health', base);
          const response = await fetch(health, {headers: {Origin: origin}, signal: AbortSignal.timeout(20000)});
          if (!response.ok || (await response.json()).ok !== true) throw new Error('Backend health check failed.');
          if (response.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('APP_ORIGIN does not allow the GitHub Pages origin.');
          }
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/derang/browser
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@v4
